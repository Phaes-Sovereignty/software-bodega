name: factory

# The Small Loop's foreman. Nothing self-merges; this decides what a human is
# allowed to merge. Missing evidence NEVER counts as green — every job that
# cannot prove its result fails.
#
# NOTHING HERE HARD-CODES A LANGUAGE OR A TEST PATH. The `detect` job asks the
# project's own factory/toolchain.env (via scripts/toolchain.sh) where the suites
# live and how to run them, and every later job uses that answer. Previously this
# file assumed factory/tests/heldout + python3 + run-heldout.sh, so a Swift PR
# got a held-out job that unpacked a tarball into a directory the project does
# not use and then ran a shell script that did not exist.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.tc.outputs.runner }}
      setup: ${{ steps.tc.outputs.setup }}
      kind: ${{ steps.tc.outputs.kind }}
      heldout_dir: ${{ steps.tc.outputs.heldout_dir }}
      visible_dir: ${{ steps.tc.outputs.visible_dir }}
      visible_cmd: ${{ steps.tc.outputs.visible_cmd }}
      heldout_cmd: ${{ steps.tc.outputs.heldout_cmd }}
    steps:
      - uses: actions/checkout@v4
      - id: tc
        run: |
          set -euo pipefail
          matrix="$(bash scripts/toolchain.sh ci-matrix)"
          echo "runner=$(printf '%s' "$matrix" | sed -n 's/.*"runner":"\([^"]*\)".*/\1/p')"       >> "$GITHUB_OUTPUT"
          echo "setup=$(printf '%s' "$matrix" | sed -n 's/.*"setup":"\([^"]*\)".*/\1/p')"         >> "$GITHUB_OUTPUT"
          echo "kind=$(printf '%s' "$matrix" | sed -n 's/.*"kind":"\([^"]*\)".*/\1/p')"           >> "$GITHUB_OUTPUT"
          echo "heldout_dir=$(bash scripts/toolchain.sh get HELDOUT_DIR)"   >> "$GITHUB_OUTPUT"
          echo "visible_dir=$(bash scripts/toolchain.sh get VISIBLE_DIR)"   >> "$GITHUB_OUTPUT"
          echo "visible_cmd=$(bash scripts/toolchain.sh get VISIBLE_CMD)"   >> "$GITHUB_OUTPUT"
          echo "heldout_cmd=$(bash scripts/toolchain.sh get HELDOUT_CMD)"   >> "$GITHUB_OUTPUT"
      - name: Refuse a toolchain that cannot be honoured
        run: |
          set -euo pipefail
          d="$(bash scripts/toolchain.sh get HELDOUT_DIR)"
          case "$d" in
            ""|/*|*..*) echo "::error::HELDOUT_DIR='$d' is empty, absolute, or escapes the repo"; exit 1 ;;
          esac
          if [ "$d" = "factory/tests/heldout" ] && [ ! -d factory/tests/heldout ] && [ -d Tests/HeldoutTests ]; then
            echo "::error::Tests/HeldoutTests exists but factory/toolchain.env does not declare HELDOUT_DIR."
            echo "::error::The seal would remove an empty directory and the builder would read the exam."
            exit 1
          fi

  build:
    needs: detect
    runs-on: ${{ needs.detect.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Setup (python)
        if: needs.detect.outputs.setup == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (node)
        if: needs.detect.outputs.setup == 'node'
        uses: actions/setup-node@v4
      - name: Setup (swift)
        if: needs.detect.outputs.setup == 'swift'
        run: swift --version
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          if [ -f package.json ]; then npm ci || npm install; fi
      - name: Build
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh
          cmd="$(bash scripts/toolchain.sh get BUILD_CMD)"
          if [ -n "$cmd" ]; then echo "BUILD_CMD: $cmd"; eval "$cmd"; else echo "no BUILD_CMD declared"; fi

  visible:
    needs: [detect, build]
    runs-on: ${{ needs.detect.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup (python)
        if: needs.detect.outputs.setup == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (node)
        if: needs.detect.outputs.setup == 'node'
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          if [ -f package.json ]; then npm ci || npm install; fi
      - name: Visible suite
        env:
          VISIBLE_CMD: ${{ needs.detect.outputs.visible_cmd }}
          VISIBLE_DIR: ${{ needs.detect.outputs.visible_dir }}
        run: |
          set -euo pipefail
          [ -n "$VISIBLE_CMD" ] || { echo "::error::no visible command — cannot prove green"; exit 1; }
          if [ ! -d "$VISIBLE_DIR" ]; then
            echo "::error::visible suite directory '$VISIBLE_DIR' is absent — missing evidence is not a pass"
            exit 1
          fi
          echo "visible: $VISIBLE_CMD"
          eval "$VISIBLE_CMD" | tee visible.log
      - uses: actions/upload-artifact@v4
        with: { name: visible-receipt, path: visible.log }

  heldout:
    needs: [detect, build]
    runs-on: ${{ needs.detect.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup (python)
        if: needs.detect.outputs.setup == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup (node)
        if: needs.detect.outputs.setup == 'node'
        uses: actions/setup-node@v4
      # The worker never sees these. They arrive here and only here.
      # If >40KB, swap this step for a private-repo checkout with a PAT.
      - name: Fetch held-out suite from secrets
        env:
          HELDOUT_TESTS: ${{ secrets.HELDOUT_TESTS }}
          HELDOUT_DIR: ${{ needs.detect.outputs.heldout_dir }}
        run: |
          set -euo pipefail
          if [ -z "$HELDOUT_TESTS" ]; then
            echo "::error::HELDOUT_TESTS secret is empty — held-out suite cannot run."
            echo "::error::Missing evidence is not a pass. Failing."
            exit 1
          fi
          [ -n "$HELDOUT_DIR" ] || { echo "::error::HELDOUT_DIR resolved empty"; exit 1; }
          echo "sealing target: $HELDOUT_DIR (toolchain-declared, not hard-coded)"
          rm -rf "$HELDOUT_DIR"
          mkdir -p "$HELDOUT_DIR"
          echo "$HELDOUT_TESTS" | base64 -d | tar xz -C "$HELDOUT_DIR"
          echo "held-out checks unpacked: $(find "$HELDOUT_DIR" -type f | wc -l)"
      - name: Held-out suite
        env:
          HELDOUT_CMD: ${{ needs.detect.outputs.heldout_cmd }}
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          [ -n "$HELDOUT_CMD" ] || { echo "::error::no held-out command — cannot prove green"; exit 1; }
          echo "heldout: $HELDOUT_CMD"
          eval "$HELDOUT_CMD" | tee heldout.log
      - uses: actions/upload-artifact@v4
        with: { name: heldout-receipt, path: heldout.log }

  scope:
    needs: detect
    runs-on: ${{ needs.detect.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scope + seal check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE".."$HEAD" > changed.txt
          printf '%s\n' "$PR_BODY" > pr-body.txt
          # One script, also exercised by scripts/selftest.sh. The logic used to
          # be inline YAML and the selftest re-typed it into a shell function, so
          # the "test" validated a transcription instead of what CI runs.
          bash scripts/ci-scope.sh check changed.txt pr-body.txt

  review:
    needs: [detect, visible, heldout, scope]
    runs-on: ${{ needs.detect.outputs.runner }}
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: receipts }
      - name: Judge review comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          V: ${{ needs.visible.result }}
          H: ${{ needs.heldout.result }}
          S: ${{ needs.scope.result }}
          D: ${{ needs.detect.result }}
        run: |
          # Artifact-only context: contract + diff + receipts. Never a transcript.
          PR=${{ github.event.pull_request.number }}
          BASE=${{ github.event.pull_request.base.sha }}
          if [ "$D" != "success" ]; then
            # detect failed => the toolchain is unusable. That is missing evidence,
            # and it must not be reported as a green run of nothing.
            echo "::error::toolchain detection failed — no evidence could be gathered"
            exit 1
          fi
          if [ "$V" != "success" ] || [ "$H" != "success" ] || [ "$S" != "success" ]; then
            {
              printf 'Verdict on %s: NOT DONE\n\n' "$SHA"
              printf 'CI evidence incomplete or failing — visible=%s heldout=%s scope=%s.\n' "$V" "$H" "$S"
              printf 'Missing evidence never counts as green.\n'
            } > verdict.txt
            gh pr comment "$PR" --body-file verdict.txt
            exit 0
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            {
              printf 'Verdict on %s: mechanical gates GREEN (visible, held-out, scope).\n\n' "$SHA"
              printf 'Judge review skipped: no ANTHROPIC_API_KEY configured.\n'
            } > verdict.txt
            gh pr comment "$PR" --body-file verdict.txt
            exit 0
          fi
          # Cross-family judge. The CI executor is the PR's author, and its family
          # is whatever the night shift used; models.env is the same file here, so
          # the check is real rather than decorative.
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true
          {
            cat skills/inspector/SKILL.md
            printf '\n===== CONTRACT =====\n'
            cat factory/CONTRACT.md 2>/dev/null
            printf '\n===== DIFF =====\n'
            git diff "$BASE".."$SHA" | head -c 60000
            printf '\n===== TEST RECEIPTS =====\n'
            cat receipts/*/*.log 2>/dev/null | head -c 20000
            printf '\nReview this PR from these artifacts only.\n'
            printf 'Your first line must be exactly: Verdict on %s: SHIP|FIX FIRST|NOT DONE\n' "$SHA"
          } > prompt.txt
          claude -p --output-format json < prompt.txt 2>/dev/null \
            | jq -r '.result // empty' > verdict.txt
          if [ ! -s verdict.txt ]; then
            printf 'Verdict on %s: NOT DONE\n\nJudge call failed — no verdict produced. Missing evidence is not a pass.\n' "$SHA" > verdict.txt
          fi
          head -c 60000 verdict.txt > verdict.trim && mv verdict.trim verdict.txt
          gh pr comment "$PR" --body-file verdict.txt
