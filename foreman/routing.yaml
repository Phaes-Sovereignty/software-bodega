# routing.yaml — the ONLY place model identities live at Phase C.
#
# Prompt files name roles, never models. Upgrading a model is an edit here plus
# models.env; no prompt changes, no code changes.
#
# RUNTIME: oh-my-pi (omp) for every role. One binary serving four families means
# the command no longer tells you the provider, so `family` below is pinned from
# --model and MUST stay in step with it. `omp -p` with no --model falls back to
# grok-4.5, which would quietly put judge and executor in the same family.
# The families table still resolves these ids by glob, so family_of_model()
# keeps working for ledger rows that carry a raw model name.

families:
  anthropic: [claude, claude-*]
  xai:       [grok, grok-*]
  openai:    [codex, codex-*, gpt-*]
  moonshot:  [kimi, kimi-*, k3, k3-*]   # k3 does NOT match kimi-*
  local:     [local/*, qwopus*]         # llama.cpp served on localhost

roles:
  executor:
    model: grok-build
    family: xai
    cmd: ["omp", "-p", "--no-session", "--model", "grok-build"]
    input: arg          # omp takes the prompt as an argument; stdin is not used
  planner:
    model: claude-opus-4-8
    family: anthropic
    cmd: ["omp", "-p", "--no-session", "--model", "claude-opus-4-8"]
    input: arg
  judge:
    model: claude-opus-4-8
    family: anthropic
    cmd: ["omp", "-p", "--no-session", "--model", "claude-opus-4-8"]
    input: arg
  plan_judge:
    model: gpt-5.6-sol
    family: openai
    cmd: ["omp", "-p", "--no-session", "--model", "gpt-5.6-sol"]
    input: arg
  glue:
    model: grok-4.5
    family: xai
    cmd: ["omp", "-p", "--no-session", "--model", "grok-4.5"]
    input: arg
  # triage classifies incoming issues (scripts/triage.sh) and is named in
  # models.env's JUDGE_ROLES, so it must exist here too. JUDGE_ROLES is read by
  # both the shell and Router.judge_for_family; a role the Python side does not
  # know is a candidate it silently skips, and the two readers then disagree
  # about which judges exist -- the same class of bug as the duplicated ladder.
  triage:
    model: claude-opus-4-8
    family: anthropic
    cmd: ["omp", "-p", "--no-session", "--model", "claude-opus-4-8"]
    input: arg
  fallback:
    model: local/qwopus3.6-27b
    family: local             # a fourth family, reached only by escalation
    cmd: ["bash", "scripts/lib/local-model.sh"]
    input: arg

# Independence invariants. Each is (judge_role, author_role): the two must never
# resolve to the same family. Checked at startup and before every judged gate.
independence:
  - [judge, executor]        # the inspector must not share a family with the builder
  - [plan_judge, planner]    # the plan reviewer must not share one with the author

# Escalation ladder: deliberately NOT declared here.
#
# It lives in models.env as ESCALATION_LADDER / ESCALATION_TRIGGER, and
# Router.escalation_ladder() parses that same string. Declaring it in YAML is
# what killed it: the night shift is bash and cannot read this file without
# PyYAML, so it never climbed a single rung while the config looked complete and
# nothing complained. One question, one file, readable by both consumers;
# scripts/tests/test-ladder.sh and foreman's suite assert the two readers agree.

# Ceilings. Exactly ONE of these may block; the other observes and warns.
# Two blocking ceilings means a night can die for a reason nobody chose.
ceilings:
  rounds:
    limit: 40
    action: block
  tokens:
    limit: 4000000
    action: warn
    warn_at: 0.8

timeouts:
  role_seconds: 3600        # a station that has genuinely stopped making progress
  probe_seconds: 180        # startup adapter contract test

# There is deliberately NO `paths:` block here. Where the suites live is a
# property of the PROJECT (factory/toolchain.env -> HELDOUT_DIR), resolved by
# scripts/lib/toolchain.sh and read by foreman/contracts.py. Declaring it again
# here gave the same question two answers, and the seal took this file's: a Swift
# package was sealed at factory/tests/heldout, an empty directory, while
# Tests/HeldoutTests stayed readable and the log reported the seal as verified.
