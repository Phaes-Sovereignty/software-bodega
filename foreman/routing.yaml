# routing.yaml — the ONLY place model identities live at Phase C.
#
# Prompt files name roles, never models. Upgrading a model is an edit here plus
# models.env; no prompt changes, no code changes.
#
# RUNTIME: oh-my-pi (omp) for every role. One binary serving four families means
# the command no longer tells you the provider, so `family` below is pinned from
# --model and MUST stay in step with it. `omp -p` with no --model falls back to
# grok-4.5, which would quietly put judge and executor in the same family.
# The families table still resolves these ids by glob, so family_of_model()
# keeps working for ledger rows that carry a raw model name.

families:
  anthropic: [claude, claude-*]
  xai:       [grok, grok-*]
  openai:    [codex, codex-*, gpt-*]
  moonshot:  [kimi, kimi-*, k3, k3-*]   # k3 does NOT match kimi-*

roles:
  executor:
    model: grok-build
    family: xai
    cmd: ["omp", "-p", "--no-session", "--model", "grok-build"]
    input: arg          # omp takes the prompt as an argument; stdin is not used
  planner:
    model: claude-opus-5
    family: anthropic
    cmd: ["omp", "-p", "--no-session", "--model", "claude-opus-5"]
    input: arg
  judge:
    model: claude-opus-5
    family: anthropic
    cmd: ["omp", "-p", "--no-session", "--model", "claude-opus-5"]
    input: arg
  plan_judge:
    model: gpt-5.6-sol
    family: openai
    cmd: ["omp", "-p", "--no-session", "--model", "gpt-5.6-sol"]
    input: arg
  glue:
    model: grok-4.5
    family: xai
    cmd: ["omp", "-p", "--no-session", "--model", "grok-4.5"]
    input: arg
  fallback:
    model: k3
    family: moonshot          # a fourth family, reached only by escalation
    cmd: ["omp", "-p", "--no-session", "--model", "k3"]
    input: arg

# Independence invariants. Each is (judge_role, author_role): the two must never
# resolve to the same family. Checked at startup and before every judged gate.
independence:
  - [judge, executor]        # the inspector must not share a family with the builder
  - [plan_judge, planner]    # the plan reviewer must not share one with the author

# Escalation ladder. Triggered ONLY by a verify failure — never by a low
# confidence score, a long runtime, or an agent asking to be escalated.
escalation:
  trigger: verify_failure_only
  ladder:
    - {strategy: resample, role: executor, n: 3, select: execution}
    - {strategy: single,   role: planner}
    - {strategy: single,   role: plan_judge}
    # Last rung: a fourth family. If resample and two other families all failed
    # the same verify, trying the same families again is not a new hypothesis.
    - {strategy: single,   role: fallback}

# Ceilings. Exactly ONE of these may block; the other observes and warns.
# Two blocking ceilings means a night can die for a reason nobody chose.
ceilings:
  rounds:
    limit: 40
    action: block
  tokens:
    limit: 4000000
    action: warn
    warn_at: 0.8

timeouts:
  role_seconds: 3600        # a station that has genuinely stopped making progress
  probe_seconds: 180        # startup adapter contract test

paths:
  heldout: factory/tests/heldout
  visible_runner: factory/tests/run-visible.sh
  heldout_runner: factory/tests/run-heldout.sh
